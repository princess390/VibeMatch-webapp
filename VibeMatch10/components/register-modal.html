<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content auth-modal">
      <div class="modal-header">
        <h5 class="modal-title">Regisztráció</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bezárás"></button>
      </div>

      <div class="modal-body">
        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="registerEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="registerEmail" autocomplete="email" required>
          </div>

          <div class="mb-3">
            <label for="registerPassword" class="form-label">Jelszó</label>
            <input type="password" class="form-control" id="registerPassword" autocomplete="new-password" required>
          </div>

          <p id="registerMessage" class="auth-message" aria-live="polite"></p>

          <button type="submit" class="btn btn-primary w-100">
            Regisztrálok
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
