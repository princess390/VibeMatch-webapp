<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Bejelentkezés</h2>

    <form id="loginForm">

        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Jelszó" required>

        <button type="submit">Login</button>

    </form>
    <div class="modal fade" id="loginModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Bejelentkezés</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <form id="loginForm">

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>

                        <div class="mb-3">
                            <label>Jelszó</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Bejelentkezem
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script type="module" src="assets/js/login.js?v=20260428-4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="assets/js/adatok.js?v=20260428-4"></script>

    <script type="module" src="assets/js/main.js?v=20260428-4"></script>
    <script type="module" src="assets/js/auth-ui.js?v=20260428-4"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
